<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="../../Assets/Img/Items/battle-item/x-speed.png" type="image/x-icon">
    <title>Velocidad X - Item</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body{user-select: none;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
        .container{max-width:800px;width:100%;background:rgba(255,255,255,0.03);border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,0.06);}
        .back{font-size:3rem;color:#fff;text-decoration:none;display:inline-block;transition:.3s;line-height:1;}
        .back:hover{transform:scale(1.15);}
        .info{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin:10px 0;}
        .name-container h1{font-size:2.2rem;font-weight:700;color:#fff;}
        .types{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;}
        .type{padding:4px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;text-transform:uppercase;color:#fff;background:#3b4cca;display:flex;flex-direction:row;align-items:center;justify-content:center;}
        .number-container{text-align:right;}
        .number{color:#aaa;font-size:1.8rem;font-weight:400;}
        .category{color:#888;font-size:0.85rem;}
        .img-container{display:flex;justify-content:center;padding:20px 0;}
        .img-container img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5));}
        .section{background:rgba(255,255,255,0.03);border-radius:12px;padding:20px;margin:15px 0;border:1px solid rgba(255,255,255,0.05);}
        .section h2{color:#ffde00;font-size:1.5rem;font-weight:300;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:10px;margin-bottom:15px;text-align:center;}
        .info-grid{display:flex;flex-direction:row;align-items:center;justify-content:center;}
        .info-item{text-align:center;}
        .info-item .value{color:#fff;font-size:1.1rem;font-weight:500;}
        .ubicacion{background:rgba(255,215,0,0.05);border-left:3px solid #ffde00;padding:15px;border-radius:8px;margin:15px 0;}
        .ubicacion .label{color:#888;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;}
        .ubicacion .value{color:#ffde00;font-size:1rem;margin-top:5px;}
        .portado{text-align:center;padding:10px;color:#666;font-size:0.85rem;border-top:1px solid rgba(255,255,255,0.05);margin-top:20px;}
        .portado strong{color:#888;}
        .descripcion-text{color:#ccc;font-size:1.1rem;text-align:center;line-height:1.6;}
        @media(max-width:600px){.info{flex-direction:column;align-items:center;text-align:center;}.number-container{text-align:center;}.back{font-size:2.5rem;}}
        ::-webkit-scrollbar-track {background: rgb(27, 27, 27);}
        ::-webkit-scrollbar-thumb {background: linear-gradient(180deg, #09f, #036); border-radius:5px;}
        ::-webkit-scrollbar-thumb:hover {background: linear-gradient(180deg, #0af, #048);}
    </style>
</head>
<body>
    <div class="container">
        <a href="../../connections/items.html" class="back">⬅</a>
        
        <div class="info">
            <div class="name-container">
                <h1>Velocidad X</h1>
                <div class="types"><span class="type">Objeto de Combate</span></div>
            </div>
            <div class="number-container">
            </div>
        </div>

        <div class="img-container">
            <img src="../../Assets/Img/Items/battle-item/x-speed.png" alt="Velocidad X" onerror="this.src='../../Assets/Img/pokeball.svg'">
        </div>

        <div class="section">
            <h2>Acerca de</h2>
            <div class="info-grid">
                <div class="info-item">
                    <div class="value descripcion-text">Aumenta la Velocidad de un Pokémon en combate.</div>
                </div>
            </div>
        </div>

        <div class="ubicacion">
            <div class="label">📍 Ubicación</div>
            <div class="value"></div>
        </div>

        <div class="portado">
            <strong>PORTADO POR ESPECIES</strong>
        </div>
    </div>
    <script src="stats.js"></script>
</body>
</html>
